# 허들링 앱 화면 설계 하네스 — 규칙 SSOT
# 배경 설명은 harness/guides/figma-design-guide.md 참고. 실행 중 판정은 이 파일과
# harness/scripts/*.js만 기준으로 한다.

completion:
  design_violations_count: 0
  policy_violations_count: 0
  figma_keyscreen_count_min: 2

gates:
  G1:
    stage: "Stage 1 -> Stage 2"
    judge: automatic
    checked_by: harness/scripts/check_g1.js
    pass_condition: "extracted_insights_count >= (reference_url_count - failed_url_count)"
    halt_condition: "failed_url_count == reference_url_count"
    on_fail_return_to: stage_1

  G2:
    stage: "Stage 2 -> Stage 3"
    judge: human
    pass_condition: "approved_by != null AND approved_at != null"
    on_reject_return_to: stage_2
    timeout: none
    note: "이 하네스에서 사람이 개입하는 유일한 게이트"

  G3:
    stage: "Stage 3 -> done"
    judge: automatic
    checked_by: harness/scripts/check_g3.js
    checks:
      - name: design_tokens
        method: script
        source: figma-tokens-used.json vs design_tokens_allowlist
      - name: policy_violations
        method: judge_agent_visual_review
        source: "docs/story-service.md 규칙 1 (개인정보·고객정보·회사기밀·타인의 저작물 금지)"
    on_fail_return_to: stage_3

retry:
  automatic_gates_max_retries: 2
  on_exceed: halt_and_notify_human
  human_gate_retry: none

edit_permissions:
  writable_by_stage_agents:
    - "runs/{target_screen}/"
    - "figma file: {target_screen} 관련 프레임"
  readonly_paths_for_all_agents:
    - "docs/"
    - "harness/*.md"
    - "harness/rules.yaml"
    - "harness/defaults.yaml"
    - ".claude/"
  judge_agent: read_only # 어떤 파일도 쓰지 않음, Bash는 scripts/ 실행에만 사용

resume:
  state_file: "runs/{target_screen}/03-state.json"
  default: resume
  fresh_flag: "--fresh"

design_tokens_allowlist:
  source: "docs/design.md"
  colors: [ink, canvas, canvas-soft, field, hairline-soft, hairline, ink-soft, text-muted, text-faint, primary, accent, on-primary]
  rounded: [none, sm, md, full]
  typography: [display, heading-1, heading-2, heading-3, heading-4, title, body-lg, body, body-sm, link, label, caption]

policy_violation_source: "docs/story-service.md 어기면 안 되는 것 규칙 1"
